site_name: backupd
site_description: Declarative S3-compatible backup daemon with delta-deduplication, encryption, retention, and scheduling
repo_url: https://github.com/soroushalinia/backupd
edit_uri: blob/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: amber
      accent: yellow
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: amber
      accent: yellow
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.prune
    - navigation.top
    - navigation.footer
    - toc.integrate
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - table

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed
  - pymdownx.details

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Quick Start: quickstart.md
      - Examples: examples.md
  - Guide:
      - Configuration: configuration.md
      - Sources: sources.md
      - Restore & Verify: restore.md
      - Encryption: encryption.md
      - Retention: retention.md
      - Hooks: hooks.md
      - Scheduling: scheduling.md
  - CLI Reference: cli.md
  - FAQ: faq.md
